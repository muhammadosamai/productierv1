name: Deploy Productierv1 (Stage)

on:
  push:
    branches: ["stage"]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy productierv1 (stage)
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Setup SSH (NO ssh-agent, safe method)
      - name: Setup SSH
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Save private key
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add server to known_hosts
          ssh-keyscan -H 216.250.122.193 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # ✅ Deploy
      - name: Deploy to Stage Server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes scripts@216.250.122.193 << 'EOF'
          set -e

          cd /var/www/productierv1/server

          echo "📥 Fetching latest code..."
          git fetch origin stage
          git reset --hard origin/stage

          echo "🛑 Stopping old containers..."
          docker-compose down

          echo "🚀 Building and starting containers..."
          docker-compose up -d --build

          echo "✅ Productierv1 Stage deployment completed"
          EOF

      # ✅ Cleanup (VERY IMPORTANT for security)
      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
