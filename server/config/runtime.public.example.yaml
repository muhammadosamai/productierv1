# Productier non-secret runtime configuration template.
# Copy this file to runtime.public.yaml and tune values per environment.
# Secrets (DB credentials, private keys, API keys, webhook URLs) must stay in secret storage.

NODE_ENV: development
PORT: 3001
CORS_ORIGINS:
  - http://localhost:5173

AUTH_SECRET_MODE: required
JWT_ACCESS_TTL: 7d
JWT_ISSUER: productier
JWT_AUDIENCE:
  - productier-web
# JWT_ACTIVE_KID: 2026-03
# JWT_PUBLIC_KEYS_JSON:
#   "2026-03": |
#     -----BEGIN PUBLIC KEY-----
#     ...
#     -----END PUBLIC KEY-----
# JWT_PUBLIC_KEYS_PATH: ./keys/jwt-public-keys.json
# JWT_PUBLIC_KEY_PATH: ./keys/jwt-2026-03-public.pem
# JWT_PUBLIC_KEY_PEM: |
#   -----BEGIN PUBLIC KEY-----
#   ...
#   -----END PUBLIC KEY-----

API_USERS_SEARCH_LIMIT: 50
API_USERS_LIST_LIMIT: 100

NOTIFICATIONS_ENABLED: true
NOTIFICATIONS_ROLLOUT_MODE: on
NOTIFICATIONS_PUBLISH_RETRIES: 2
NOTIFICATIONS_MAX_INBOX_PAGE_SIZE: 100
NOTIFICATIONS_UNREAD_DRIFT_WARN_THRESHOLD: 25
NOTIFICATIONS_EMAIL_CHANNEL_ENABLED: false
NOTIFICATIONS_SLACK_CHANNEL_ENABLED: false
NOTIFICATIONS_CHANNEL_TIMEOUT_MS: 4000
NOTIFICATIONS_REMINDER_SCHEDULER_ENABLED: false
NOTIFICATIONS_REMINDER_INTERVAL_MS: 900000
NOTIFICATIONS_REMINDER_COOLDOWN_MINUTES: 720
NOTIFICATIONS_REMINDER_DUE_SOON_HOURS: 48
NOTIFICATIONS_REMINDER_STALE_IN_PROGRESS_HOURS: 168
NOTIFICATIONS_REMINDER_REVIEW_SLA_HOURS: 24

GLOBAL_SEARCH_ENABLED: true
GLOBAL_SEARCH_SEMANTIC_ENABLED: true
GLOBAL_SEARCH_DEFAULT_LIMIT: 20
GLOBAL_SEARCH_MAX_LIMIT: 50
GLOBAL_SEARCH_LEXICAL_PER_TYPE_LIMIT: 35
GLOBAL_SEARCH_LEXICAL_CANDIDATE_MULTIPLIER: 3
GLOBAL_SEARCH_LEXICAL_SIMILARITY_FLOOR: 0.2
GLOBAL_SEARCH_SEMANTIC_CANDIDATE_LIMIT: 80
GLOBAL_SEARCH_SEMANTIC_MIN_SCORE: 0.24
GLOBAL_SEARCH_SEMANTIC_TIMEOUT_MS: 1200
GLOBAL_SEARCH_EMBEDDING_QUERY_CACHE_TTL_MS: 45000
SEARCH_EMBEDDING_PROVIDER: none
SEARCH_EMBEDDING_MODEL: text-embedding-3-small
SEARCH_EMBEDDING_DIMENSIONS: 1536
SEARCH_EMBEDDING_BASE_URL: https://api.openai.com/v1

HOME_MULTI_VIEW_ENABLED: true
HOME_DAILY_BRIEF_ENABLED: true
HOME_DAILY_BRIEF_PROVIDER: openai
HOME_DAILY_BRIEF_MODEL: gpt-5.4-mini
HOME_DAILY_BRIEF_BASE_URL: https://api.openai.com/v1
HOME_DAILY_BRIEF_TIMEOUT_MS: 15000
# Legacy fallback token cap. Mode-specific values override this when set.
HOME_DAILY_BRIEF_MAX_TOKENS: 500
HOME_DAILY_BRIEF_SUMMARY_MAX_TOKENS: 1200
HOME_DAILY_BRIEF_FULL_MAX_TOKENS: 1600
HOME_DAILY_BRIEF_TEMPERATURE: 1
HOME_DAILY_BRIEF_CACHE_TTL_MS: 3600000
HOME_DAILY_BRIEF_FALLBACK_CACHE_TTL_MS: 15000
# Retry parse/sanitization failures with a safer model and compact context.
HOME_DAILY_BRIEF_RETRY_MODEL: gpt-5.4-mini
HOME_DAILY_BRIEF_RETRY_CONTEXT_MAX_CHARS: 4200
HOME_DAILY_BRIEF_REASONING_EFFORT: low

STORAGE_BACKEND: local
STORAGE_LOCAL_ROOT: uploads
STORAGE_PUBLIC_PREFIX: /uploads
# STORAGE_PUBLIC_BASE_URL: https://cdn.example.com
# S3_BUCKET: productier-assets
# S3_REGION: us-east-1
# S3_ENDPOINT: https://s3.amazonaws.com
# S3_FORCE_PATH_STYLE: false
# S3_PUBLIC_BASE_URL: https://cdn.example.com

INTEGRATIONS_SECRET_MODE: required

# Optional seed profile overrides for local scripts.
# SEED_PROFILE_PATH: src/db/seed-profiles/full-default.json
# SEED_FULL_PACK_PATH: src/db/seed-profiles/full-default.json
# SEED_USERS_PACK_PATH: src/db/seed-profiles/users-default.json

# Optional frontend dev proxy helpers.
# VITE_API_PORT: "3001"
# VITE_API_PROXY_TARGET: http://localhost:3001
# VITE_UPLOADS_PROXY_PREFIX: /uploads
