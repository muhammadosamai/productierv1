version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: stage-productier
    restart: unless-stopped
    environment:
      POSTGRES_USER: sarimalavi
      POSTGRES_DB: productier_staging
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - productier_pgdata:/var/lib/postgresql/data
    ports:
      - "6050:6050"

  backend:
    build: .
    container_name: stage-productier-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://sarimalavi@postgres:6050/productier_staging
    ports:
      - "3010:3010"

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    container_name: stage-productier-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3030:80"

volumes:
  productier_pgdata:
