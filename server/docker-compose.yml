version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: productier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: productier
      POSTGRES_PASSWORD: productier
      POSTGRES_DB: productier
    volumes:
      - productier_pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: productier-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://productier:productier@postgres:5432/productier
    ports:
      - "3002:3001"

volumes:
  productier_pgdata:
