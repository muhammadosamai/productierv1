version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: productier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sarimalavi
      POSTGRES_DB: productier
      POSTGRES_HOST_AUTH_METHOD: trust   # no password, matches your .env
    volumes:
      - productier_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarimalavi -d productier"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6000:6000"
 
  backend:
    build: .
    container_name: productier-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sarimalavi@postgres:5432/productier
      RUN_DB_MIGRATIONS: "true"
    volumes:
      - productier_uploads:/app/uploads
    ports:
      - "3002:3001"

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    container_name: productier-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3050:80"

volumes:
  productier_pgdata:
  productier_uploads:
